# The runner (runner/): its tests, its dependency checks, its .deb for both
# architectures, and the install proof: install.sh on a fresh Ubuntu 24.04 VM,
# then a scenario through the running service; the container image for both
# architectures and its proof, locked down, on the same scenario.
name: runner
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: every vector replays through the runner; config, doctor, selftest, service and fabric tests
        run: cargo test --locked
        working-directory: runner
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0,cargo-deny@0.21.0
      - name: no dependency with a known advisory
        run: cargo audit --deny warnings
        working-directory: runner
      - name: licenses, sources and bans of every dependency
        run: cargo deny --locked check
        working-directory: runner
      - name: runner/THIRD-PARTY.md lists every crate in Cargo.lock
        run: python3 -I runner/packaging/third-party.py --check
      - name: the shell scripts pass shellcheck
        run: shellcheck -s sh runner/install.sh runner/packaging/*.sh runner/packaging/deb/*
      - name: every workflow step's script exists and its job checks out first; dist/ is filled before it is read
        run: |
          python3 -I runner/packaging/check-workflows.py --self-test
          python3 -I runner/packaging/check-workflows.py .github/workflows/*.yml

  volume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the volume test at 50 and 200 objects, against runner/volume/budget.json
        run: cargo test --release --locked --test volume -- --ignored --nocapture
        working-directory: runner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: volume-results
          path: runner/target/volume/results.json
          if-no-files-found: ignore

  fieldkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the operator page carries the current Bleating Edge
        run: python3 -I runner/fieldkit/inline.py --check
      - name: the scope guard refuses what it should
        run: python3 -I runner/fieldkit/check-scope.py --self-test
      - name: build the runner
        run: cargo build --locked
        working-directory: runner
      - name: every action on the page is an allowed CLI verb that exists
        run: |
          runner/target/debug/goat-processors help > "$RUNNER_TEMP/usage.txt"
          python3 -I runner/fieldkit/check-scope.py --usage "$RUNNER_TEMP/usage.txt"
      - name: install the browser test (pinned in package-lock.json)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: runner/fieldkit/e2e
      - name: a browser drives every action against a running runner
        run: npx playwright test
        working-directory: runner/fieldkit/e2e
        env:
          CI: "1"
          RUNNER_BIN: ../../target/debug/goat-processors
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fieldkit-test-results
          path: |
            runner/fieldkit/e2e/test-results/
            runner/fieldkit/e2e/.run/runner.log
          if-no-files-found: ignore

  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # Built on the oldest Ubuntu it is for: a binary links against the build
    # host's glibc and needs that version or newer to run.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the Rust toolchain (the image's rustup stable; installed if the image has none)
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            "$HOME/.cargo/bin/cargo" --version
          else
            cargo --version
          fi
      - name: the release binary, with build paths replaced so no build machine path appears in a site's log
        run: cargo build --release --locked
        working-directory: runner
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
      - name: the binary needs at most glibc 2.35 (Ubuntu 22.04, Jetson Linux 36)
        run: runner/packaging/check-glibc.sh 2.35 runner/target/release/goat-processors
      - run: runner/packaging/build-deb.sh ${{ matrix.arch }} runner/target/release/goat-processors dist
      - name: the package installs and its selftest passes
        run: |
          sudo apt-get install -y -q ./dist/goat-processors_*_${{ matrix.arch }}.deb
          goat-processors selftest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  install:
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        # The same .deb (built on 22.04) on both Ubuntu releases it is for.
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist
      - name: install.sh on this fresh VM, a TLS fabric router, then a scenario through the service
        run: sudo runner/packaging/ci-install-test.sh dist/goat-processors_*_${{ matrix.arch }}.deb

  upgrade:
    needs: deb
    # On 24.04: the 0.5.0 package it starts from was built on 24.04 and needs its glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb-amd64
          path: dist
      - name: the previous release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download runner-v0.5.0 -R "${{ github.repository }}" -p 'goat-processors_0.5.0_amd64.deb' -D prev
      - name: an update from the previous release asks nothing, keeps the config, and the peer is set
        run: sudo runner/packaging/ci-upgrade-test.sh "$PWD/prev/goat-processors_0.5.0_amd64.deb" "$(ls "$PWD"/dist/goat-processors_*_amd64.deb)"

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the image, built natively for this architecture (base images pinned by digest)
        run: |
          docker build -f runner/packaging/container/Containerfile \
            --build-arg VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' runner/Cargo.toml | head -1)" \
            --build-arg REVISION="${{ github.sha }}" -t goat-processors:ci .
      - name: locked down (read-only, no capabilities, its own user), a TLS fabric router, then a scenario through it
        run: runner/packaging/ci-container-test.sh goat-processors:ci
