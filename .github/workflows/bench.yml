# The committed benchmark results are what tools/bench writes.
name: bench
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the sets, families, intervals and the detection-level scorer
        run: python3 -I tools/bench/test_dataset.py
      - name: a short deterministic subset of the tuning set reproduces the committed results; the documents are generated from them
        run: python3 -I tools/bench/bench.py check
  functions-current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the scorers of fuse, filter and quality against answers known by hand
        run: python3 -I tools/bench/test_functions.py
      - name: every case reproduces the committed results; the document is generated from them
        run: python3 -I tools/bench/functions.py check
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # a record names the commit of main it compares with
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the review tool
        run: python3 -I tools/review/test_review.py
      - name: every record is well formed
        run: python3 -I tools/review/review.py check
      - name: a pull request changes no merged record, and its new records measure the same here
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only --diff-filter=MDRT origin/main...HEAD -- 'reviews/*.json' | grep .; then
            echo "a merged record is never changed: add a new one"; exit 1
          fi
          git diff -z --name-only --diff-filter=A origin/main...HEAD -- 'reviews/*.json' |
            xargs -0 -r python3 -I tools/review/review.py check --rerun
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the feed check gives the known verdicts on generated feeds and shares nothing identifying
        run: python3 -I tools/feeds/test_feedcheck.py
