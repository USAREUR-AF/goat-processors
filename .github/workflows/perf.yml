# The performance harness's own tests and a short smoke run. Timings depend on
# the machine, so CI never checks a number (docs/performance.md is measured
# with `tools/perf/perf.py baseline` on one machine).
name: perf
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  perf-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the harness's own tests
        run: python3 -I tools/perf/test_perf.py
      - name: smoke run (the Python runner on every large-scenario pack, one vector command)
        run: python3 -I tools/perf/perf.py smoke
      - name: docs/performance.md is what the harness writes from the committed results
        run: python3 -I tools/perf/perf.py report --check
