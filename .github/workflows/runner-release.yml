# A tag `runner-v<version>` builds the runner's .deb for amd64 and arm64 on
# Ubuntu 22.04 (so it runs on 22.04 and 24.04; checked: glibc 2.35 at most),
# signs each file with cosign (keyless: the signature names this workflow and
# the tag), and attaches them to a GitHub Release of that tag with SHA256SUMS.
#
# Check a downloaded file (runner/INSTALL.md, step 2):
#   cosign verify-blob FILE --bundle FILE.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/USAREUR-AF/goat-processors/.github/workflows/runner-release.yml@refs/tags/runner-v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The same tag builds the container image natively on amd64 and arm64, runs
# the container proof on each (runner/packaging/ci-container-test.sh), pushes
# both to ghcr.io/usareur-af/goat-processors as one multi-arch tag
# `<version>`, and signs it with cosign (keyless) by digest. Check it:
#   cosign verify ghcr.io/usareur-af/goat-processors:<version> \
#     --certificate-identity-regexp '^https://github.com/USAREUR-AF/goat-processors/.github/workflows/runner-release.yml@refs/tags/runner-v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: runner-release
on:
  push:
    tags: ["runner-v*"]
permissions:
  contents: read
concurrency:
  group: runner-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the tag names the version in runner/Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' runner/Cargo.toml | head -1)
          test "${TAG#runner-v}" = "$want" || { echo "tag $TAG, but runner/Cargo.toml has $want"; exit 1; }

  deb:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # Built on the oldest Ubuntu it is for: a binary links against the build
    # host's glibc and needs that version or newer to run.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the Rust toolchain (the image's rustup stable; installed if the image has none)
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            "$HOME/.cargo/bin/cargo" --version
          else
            cargo --version
          fi
      - name: the release binary, with build paths replaced so no build machine path appears in a site's log
        run: cargo build --release --locked
        working-directory: runner
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
      - name: the binary needs at most glibc 2.35 (Ubuntu 22.04, Jetson Linux 36)
        run: runner/packaging/check-glibc.sh 2.35 runner/target/release/goat-processors
      - run: runner/packaging/build-deb.sh ${{ matrix.arch }} runner/target/release/goat-processors dist
      - run: |
          sudo apt-get install -y -q ./dist/goat-processors_*_${{ matrix.arch }}.deb
          goat-processors selftest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the image, built natively for this architecture
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build -f runner/packaging/container/Containerfile \
            --build-arg VERSION="${TAG#runner-v}" --build-arg REVISION="${{ github.sha }}" -t goat-processors:release .
      - name: the container proof on this image, before it is pushed
        run: runner/packaging/ci-container-test.sh goat-processors:release
      - name: push <version>-<arch>
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="ghcr.io/usareur-af/goat-processors:${TAG#runner-v}-${{ matrix.arch }}"
          docker tag goat-processors:release "$ref"
          docker push "$ref"

  image-index:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      ref: ${{ steps.index.outputs.ref }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: one tag <version> for both architectures
        id: index
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/usareur-af/goat-processors v="${TAG#runner-v}"
          docker buildx imagetools create -t "$img:$v" "$img:$v-amd64" "$img:$v-arm64"
          digest=$(docker buildx imagetools inspect "$img:$v" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "ref=$img:$v@$digest" >> "$GITHUB_OUTPUT"
      - name: sign the image by digest, keyless, and check it as a site will
        env:
          REF: ${{ steps.index.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/runner-release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

  release:
    needs: [deb, image-index]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: every .deb's binary needs at most glibc 2.35, checked again before signing
        run: |
          # readelf (binutils) and dpkg-deb, which the check uses; on the image already.
          command -v readelf >/dev/null && command -v dpkg-deb >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q binutils dpkg; }
          runner/packaging/check-glibc.sh 2.35 dist/*.deb
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign every file, keyless
        run: |
          cp runner/install.sh dist/install.sh
          cp runner/docs/install-card.pdf dist/install-card.pdf
          cd dist
          for f in *.deb install.sh install-card.pdf; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          sha256sum *.deb install.sh install-card.pdf > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: the signatures verify as a site will check them
        run: |
          cd dist
          for f in *.deb install.sh install-card.pdf SHA256SUMS; do
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/runner-release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image-index.outputs.ref }}
        run: |
          # The release's section of runner/CHANGELOG.md, then how to install it.
          v=${TAG#runner-v}
          awk -v h="## $v" '$0 == h { on = 1; next } on && /^## / { exit } on' runner/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "runner/CHANGELOG.md has no section '## $v'" >&2; exit 1; }
          printf '\nThe goat-processors runner for Ubuntu 22.04 and 24.04 (amd64, arm64; built on 22.04, needs glibc 2.35 or newer). Install: runner/INSTALL.md at this tag. Every file is signed with cosign (keyless); the .sigstore.json next to each file is its signature. Container image (amd64, arm64; signed with cosign, keyless): %s\n' "$IMAGE" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --title "goat-processors runner $v" --notes-file "$RUNNER_TEMP/notes.md"
