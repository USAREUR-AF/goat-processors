<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;Noto Sans&apos;, Helvetica, Arial, sans-serif">
<title id="t">goat-processors works on the model goat-transformers writes</title>
<desc id="d">Message formats are translated by goat-transformers into one shared report model. goat-processors reads that model and runs filter, correlate, fuse and quality on it (filter: built; correlate: built; fuse: built; quality: built). Each function returns events, a trace record for every test, and a snapshot of its whole state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7d8590"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#0d1117"/>
<text x="24" y="38" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="600">goat-processors works on the model goat-transformers writes</text>
<text x="24" y="62" font-size="14" fill="#9198a1" text-anchor="start">Translation is the base layer; every function here works on its output.</text>
