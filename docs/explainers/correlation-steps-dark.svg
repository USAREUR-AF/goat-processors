svg .ue{fill:#14303a; stroke:#6cc3da; stroke-width:1; fill-opacity:.75;}
svg .ug{fill:#14303a; stroke:#6cc3da; stroke-width:1.25; stroke-dasharray:5 4;}
svg .ugd{fill:#1b2e20; stroke:#6fc480; stroke-width:1;}
svg .mk{fill:#121417; stroke:#6cc3da; stroke-width:1.5;}
svg .mkg{fill:none; stroke:#a5acb7; stroke-width:1.5;}
svg .mkm{fill:#121417; stroke:#9ba2ac; stroke-width:1.5;}
svg .tp{stroke:#7b8592; stroke-width:1; stroke-dasharray:1.5 3.5; fill:none; stroke-linecap:round;}
svg .lnad{stroke:#6cc3da; stroke-width:2; fill:none;}
svg .lnm{stroke:#7b8592; stroke-width:1.25; fill:none; stroke-dasharray:4 4;}</style>
