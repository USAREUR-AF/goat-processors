<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
<title id="t">How goat-processors decides which tracks are the same aircraft</title>
<desc id="d">Six steps: three sensors report their own tracks with different uncertainty; sensor position and clock offsets are removed; each track is predicted ahead with a Kalman filter that switches between a quiet and a maneuver model; only tracks inside the predicted 99 percent region are candidates; all of one sensor&#x27;s tracks are assigned together at the least total cost; the result is one system track per aircraft, committed one update later.</desc>
<style>svg{font-family:sans-serif}
text{font-family:sans-serif}
svg.viz{display:block; width:100%; height:auto; font-family:currentColor;}
svg .t{fill:#e7e9ec;}
svg .tq{fill:#a5acb7;}
svg .ta{fill:#6cc3da;}
svg .tg{fill:#6fc480;}
svg .ton{fill:#121417;}
svg .bxp{fill:#1a1d21; stroke:#30363e; stroke-width:1.25;}
svg .bxa{fill:#14303a; stroke:#6cc3da; stroke-width:1.25;}
svg .ln{stroke:#7b8592; stroke-width:1.25; fill:none;}
svg .lna{stroke:#6cc3da; stroke-width:2; fill:none;}
svg .lng{stroke:#6fc480; stroke-width:2; fill:none;}
svg .fa{fill:#6cc3da;}
svg .fg{fill:#6fc480;}
