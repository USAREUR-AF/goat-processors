<text x="44" y="47.6" text-anchor="middle" class="ton" font-size="13">1</text>
<text x="64" y="48" class="t" font-size="15" font-weight="700">Each sensor tracks</text>
<rect x="270" y="20" width="220" height="162" rx="12" class="bxp"/>
<circle cx="294" cy="43" r="12" class="fa"/>
<text x="294" y="47.6" text-anchor="middle" class="ton" font-size="13">2</text>
<text x="314" y="48" class="t" font-size="15" font-weight="700">Remove offsets</text>
<text x="286" y="169" class="tq" font-size="13">sensor position and clock</text>
<rect x="520" y="20" width="220" height="162" rx="12" class="bxp"/>
<circle cx="544" cy="43" r="12" class="fa"/>
<text x="544" y="47.6" text-anchor="middle" class="ton" font-size="13">3</text>
<text x="564" y="48" class="t" font-size="15" font-weight="700">Predict ahead</text>
<text x="536" y="169" class="tq" font-size="13">Kalman filter with IMM</text>
<rect x="20" y="198" width="220" height="162" rx="12" class="bxp"/>
<circle cx="44" cy="221" r="12" class="fa"/>
<text x="44" y="225.6" text-anchor="middle" class="ton" font-size="13">4</text>
<text x="64" y="226" class="t" font-size="15" font-weight="700">Gate the candidates</text>
<text x="36" y="347" class="tq" font-size="13">inside the 99% region</text>
<rect x="270" y="198" width="220" height="162" rx="12" class="bxp"/>
<circle cx="294" cy="221" r="12" class="fa"/>
<text x="294" y="225.6" text-anchor="middle" class="ton" font-size="13">5</text>
<text x="314" y="226" class="t" font-size="15" font-weight="700">Assign all at once</text>
<text x="286" y="347" class="tq" font-size="13">least total cost: 5, not 10</text>
<rect x="520" y="198" width="220" height="162" rx="12" class="bxp"/>
<circle cx="544" cy="221" r="12" class="fa"/>
<text x="544" y="225.6" text-anchor="middle" class="ton" font-size="13">6</text>
<text x="564" y="226" class="t" font-size="15" font-weight="700">One track per aircraft</text>
<text x="536" y="347" class="tq" font-size="13">committed one tick later</text>
