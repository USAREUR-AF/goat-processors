# cargo deny check: the runner's dependencies (NOTICE, THIRD-PARTY.md).
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Explained in runner/.cargo/audit.toml. cargo deny reports unmaintained
# crates only among the runner's direct dependencies, so the unmaintained
# crates zenoh pulls in are listed there only.
ignore = [
  "RUSTSEC-2026-0041",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "EPL-2.0",
]

# The engine crate (engines/rust) is this repository's own, under its LICENSE.
[[licenses.clarify]]
crate = "goat_correlator"
expression = "Apache-2.0"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
