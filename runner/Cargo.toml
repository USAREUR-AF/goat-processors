[package]
name = "goat-processors"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "goat-processors runner: runs a declared pipeline of processing functions on the goat fabric"
license = "Apache-2.0"
publish = false

[[bin]]
name = "goat-processors"
path = "src/main.rs"

[dependencies]
# The Rust engine, through its public API only (load_pack, ingest, tick, snapshot).
goat_correlator = { path = "../engines/rust" }
# Every third-party crate is pinned and listed in NOTICE.
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "transport_tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_norway = "=0.9.42"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The runner is its own workspace, apart from the engines.
[workspace]
