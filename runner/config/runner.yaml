# goat-processors runner configuration.
# Check it after every edit:   sudo goat-processors config check
# Every key is explained in /usr/share/doc/goat-processors/README.md, Configure.

# This runner's name and its site. Letters, digits, - and _ only.
# The output prefix below is built from them.
name: processors-1
site: CHANGE-ME

# Where the packs (settings files) are. The package installs them here.
packs_dir: /usr/share/goat-processors/packs

# One tick a second. A tick is when every function produces its output.
tick_ms: 1000
# wall: ticks follow this host's clock. input: ticks follow the report times
# (only for replaying old data).
clock: wall

# The goat fabric (Zenoh). Replace CHANGE-ME with your router's name: tls/router.site-a:7447
fabric:
  mode: client
  connect:
    - tls/CHANGE-ME:7447
  tls:
    root_ca: /etc/goat-processors/tls/ca.pem
    certificate: /etc/goat-processors/tls/runner.pem
    private_key: /etc/goat-processors/tls/runner.key

# What the runner reads: the tracks the translators publish on the fabric.
inputs:
  fabric:
    keys:
      - data/entity/track/**

# The functions, in order. `goat-processors pack ls` lists every pack.
# Add a filter stage first, or a fuse stage after correlate, when needed.
pipeline:
  - function: correlate
    pack: correlate-assign-time
  - function: quality
    pack: quality-feed

# What the runner publishes: a fixed set of keys (tracks, quality, events,
# status) under volatile/<peer>/stream/processors/<name>/, goat's class for
# live data that routers pass on and never store. <peer> is the identity the
# fabric lets this runner write under, usually its certificate's common name;
# it is the site unless you set it here.
outputs:
  fabric:
    # peer: site-a-processors-1
    trace: false

# The API (README.md, "The API, and who may use it") writes every change and
# every refused request to its audit log. It takes at most 640 MiB on disk:
# past audit_max_mb MiB the log is renamed and a new one starts, and
# audit_keep older copies are kept (the current file and 9 copies of 64 MiB).
# Without a limit, config check warns.
api:
  audit_max_mb: 64
  audit_keep: 9
