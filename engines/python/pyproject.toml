[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-processors"
version = "0.3.0"
description = "Independent Python engine for goat-processors: deterministic, fully traced track correlation from packs."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
